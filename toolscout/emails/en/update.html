<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>ToolScout: what&#39;s new this month</title>
</head>
<body style="margin:0;padding:0;background:#F4F6F5;">
<div style="display:none;max-height:0;overflow:hidden;">New tools, pricing changes and a new guide.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F6F5;">
<tr><td align="center" style="padding:28px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;" dir="ltr">
    <tr><td style="padding:0 4px 18px;text-align:left;">
      <span style="display:inline-block;width:28px;height:28px;border-radius:8px;background:#10242B;vertical-align:middle;"></span>
      <span style="font:700 20px/1 'Rubik',Arial,Helvetica,sans-serif;color:#10242B;vertical-align:middle;padding:0 8px;">ToolScout</span>
    </td></tr>
    <tr><td style="background:#FFFFFF;border:1px solid #DCE3E1;border-radius:16px;padding:32px 28px;text-align:left;">
      <div style="height:4px;width:48px;background:#F2B705;border-radius:4px;margin:0 0 20px;"></div>
      <h1 style="margin:0 0 16px;font:700 24px/1.3 'Rubik',Arial,Helvetica,sans-serif;color:#10242B;">What&#39;s new this month</h1>
      <p style="margin:0 0 16px;font:16px/1.6 'Rubik',Arial,Helvetica,sans-serif;color:#10242B;">{{intro_text}}</p>
      <ul style="margin:0 0 16px;padding-left:20px;font:16px/1.7 'Rubik',Arial,Helvetica,sans-serif;color:#10242B;"><li>{{item_1}}</li><li>{{item_2}}</li><li>{{item_3}}</li></ul>
      <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 8px;"><tr><td style="background:#0E6E68;border-radius:10px;">
        <a href="{{updates_url}}" style="display:inline-block;padding:13px 22px;font:600 16px/1 'Rubik',Arial,Helvetica,sans-serif;color:#FFFFFF;text-decoration:none;">See all updates</a>
      </td></tr></table>
      
      
    </td></tr>
    <tr><td style="padding:20px 8px;text-align:left;font:13px/1.6 'Rubik',Arial,Helvetica,sans-serif;color:#4A5D65;">
      <p style="margin:0 0 6px;">You received this because you subscribed to ToolScout updates.</p>
      <p style="margin:0 0 6px;"><a href="{{unsubscribe_url}}" style="color:#0E6E68;">Unsubscribe</a> · <a href="{{preferences_url}}" style="color:#0E6E68;">Manage preferences</a></p>
      <p style="margin:0;">{{sender_name}} · {{sender_address}}</p>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
